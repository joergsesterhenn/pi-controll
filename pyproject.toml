[project]
name = "chickenpi"
version = "1.0.0"
description = "Backend for automating chicken coop with raspberry pi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "firebase-admin>=7.5.0",
    "gpiozero>=2.0.1",
    "pydantic>=2.13.4",
    "python-json-logger>=4.1.0",
    "pytz>=2026.3.post1",
    "rpi-lgpio>=0.6",
    "sentry-sdk[fastapi]>=2.66.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "toml-cli>=0.8.2",
]

[tool.pytest.ini_options]
addopts = "--capture sys"
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chickenpi*"]
